app = "cs16-server"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 27015
  protocol = "udp"

  [[services.ports]]
    port = 27015

[[services]]
  internal_port = 27015
  protocol = "tcp"

  [[services.ports]]
    port = 27015

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
